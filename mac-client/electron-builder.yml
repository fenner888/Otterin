appId: com.tourproapp.otterin
productName: Otterin
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
asar: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  artifactName: Otterin-${version}-macos-${arch}.${ext}
  # Signing: electron-builder picks up the Developer ID Application cert
  # from the login keychain (or CSC_NAME). Dev/unsigned builds use
  # `npm run pack` (--dir) which never signs.
afterPack: scripts/afterPack.mjs
afterSign: scripts/notarize.mjs
